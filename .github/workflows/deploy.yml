name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image name
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}/nginx"

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: deploy/docker-compose.prod.yml,deploy/nginx/default.conf
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            if [ ! -f .env.production ]; then
              cat > .env.production <<'EOF'
            APP_IMAGE=${{ needs.build-and-push.outputs.image }}
            HTTP_PORT=80

            POSTGRES_DB=course_bot
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=CHANGE_ME_STRONG_DATABASE_PASSWORD
            DATABASE_URL=postgresql://postgres:CHANGE_ME_STRONG_DATABASE_PASSWORD@postgres:5432/course_bot?schema=public

            PORT=3000
            BOT_TOKEN=CHANGE_ME_TELEGRAM_BOT_TOKEN
            ADMIN_IDS=CHANGE_ME_TELEGRAM_ADMIN_ID_1,CHANGE_ME_TELEGRAM_ADMIN_ID_2
            ADMIN_USERNAMES=CHANGE_ME_ADMIN_USERNAME_1,CHANGE_ME_ADMIN_USERNAME_2
            ADMIN_API_KEY=CHANGE_ME_LONG_RANDOM_ADMIN_API_KEY
            APPLICATIONS_CHANNEL_ID=CHANGE_ME_CHANNEL_ID_OR_USERNAME
            BASE_URL=https://CHANGE_ME_DOMAIN
            LOG_LEVEL=info
            CRON_TIME=0 9 * * *
            TELEGRAM_POLLING_INTERVAL=1000
            TELEGRAM_POLLING_TIMEOUT=20
            TELEGRAM_REQUEST_TIMEOUT=20000
            TELEGRAM_POLLING_ENABLED=true
            EOF
              chmod 600 .env.production
              echo "Created ${{ secrets.DEPLOY_PATH }}/.env.production with placeholders. Replace CHANGE_ME values on the server, then rerun this workflow."
              exit 1
            fi

            if grep -q 'CHANGE_ME' .env.production; then
              echo ".env.production still contains CHANGE_ME placeholders. Replace them on the server, then rerun this workflow."
              exit 1
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            export APP_IMAGE="${{ needs.build-and-push.outputs.image }}"
            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm app npx prisma migrate deploy
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
